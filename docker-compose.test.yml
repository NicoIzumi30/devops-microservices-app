version: '3.8'

services:
  app:
    build: .
    environment:
      - NODE_ENV=test
      - DB_HOST=mongodb-test
      - REDIS_HOST=redis-test
    depends_on:
      - mongodb-test
      - redis-test
    command: npm test

  mongodb-test:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
    tmpfs:
      - /data/db

  redis-test:
    image: redis:7-alpine
    tmpfs:
      - /data